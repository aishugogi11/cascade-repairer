[pytest]
pythonpath = .
testpaths = tests
; cert = live Sabre CERT tests (network + credentials) — deselected by default
; so CI and local runs stay hermetic. Run deliberately with:
;   pytest -m cert  (env: SABRE_API_USER_ID, SABRE_API_SECRET)
addopts = -m "not cert"
markers =
    cert: live Sabre CERT tests; require network + SABRE_API_USER_ID/SABRE_API_SECRET
